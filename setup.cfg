[flake8]
max-line-length = 120
extend-ignore =
    # FastAPI часто использует Depends и Header в аргументах
    WPS404,
    # f-strings (WPS305) и магические числа (WPS432)
    WPS305, WPS432,
    # Короткие имена (id, db)
    WPS110,
    # Сложность функций (иногда в API превышает норму)
    WPS221, WPS210,
    # Логика в __init__ и __all__
    WPS412, WPS410,
    # Повторы строк (часто в описаниях API)
    WPS226,
    # Конфликты с Black
    W503, WPS306,
    # Разрешаем print и pass
    WPS421, WPS420, WPS604

exclude =
    .git,
    __pycache__,
    .venv,
    tests/*,
    migrations/*,
    app/scripts/seed_db.py

per-file-ignores =
    app/schemas.py: WPS202